<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【管理者専用】ステージ進行状況コントローラー</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 15px; background-color: #202124; color: #e8eaed; }
        header { background-color: #3c4043; text-align: center; padding: 12px; font-weight: bold; font-size: 1.1rem; border-radius: 8px; margin-bottom: 20px; border: 1px solid #5f6368; }
        .admin-card { background: #2d3033; border-radius: 12px; padding: 15px; margin-bottom: 20px; border: 1px solid #5f6368; }
        .gym-title { font-size: 1.2rem; font-weight: bold; color: #8ab4f8; margin-bottom: 15px; border-bottom: 1px solid #5f6368; padding-bottom: 5px; }
        
        label { display: block; font-size: 0.9rem; margin-bottom: 5px; color: #b8bbbfc; font-weight: bold; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; background-color: #3c4043; border: 1px solid #5f6368; border-radius: 6px; color: white; font-size: 1rem; box-sizing: border-box; margin-bottom: 15px; }
        
        .flex-row { display: flex; gap: 10px; }
        .flex-row select { flex: 2; }
        .flex-row input { flex: 1; }
        
        .save-btn { width: 100%; background-color: #8ab4f8; color: #202124; border: none; padding: 12px; font-size: 1.05rem; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .save-btn:hover { background-color: #aecbfa; }
        .success-msg { color: #81c995; font-weight: bold; text-align: center; display: none; margin-top: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>⚙️ 尚志祭 ステージ進行管理パネル</header>

    <!-- 1. P体育館のコントローラー -->
    <div class="admin-card">
        <div class="gym-title">P体育館（小学校側）</div>
        
        <label>今のプログラム</label>
        <input type="text" id="p-current-input" value="演劇発表 A">
        
        <label>次のプログラム</label>
        <input type="text" id="p-next-input" value="吹奏楽部コンサート">
        
        <label>進行状況（遅れ / 巻き）</label>
        <div class="flex-row">
            <select id="p-type-input">
                <option value="none">⏳ オンタイム（定刻通り）</option>
                <option value="plus">⚠️ 進行が遅れている</option>
                <option value="minus">⏱️ 予定より巻いている</option>
            </select>
            <input type="number" id="p-val-input" value="0" min="0" placeholder="分">
        </div>
        
        <button class="save-btn" onclick="saveStatus('p')">P体育館の状況を更新</button>
        <div id="p-success" class="success-msg">✓ データを一般サイトに送信しました！</div>
    </div>

    <!-- 2. MY体育館のコントローラー -->
    <div class="admin-card">
        <div class="gym-title">MY体育館（中高側）</div>
        
        <label>今のプログラム</label>
        <input type="text" id="my-current-input" value="ダンス部パフォーマンス">
        
        <label>次のプログラム</label>
        <input type="text" id="my-next-input" value="軽音楽部LIVE">
        
        <label>進行状況（遅れ / 巻き）</label>
        <div class="flex-row">
            <select id="my-type-input">
                <option value="none">⏳ オンタイム（定刻通り）</option>
                <option value="plus" selected>⚠️ 進行が遅れている</option>
                <option value="minus">⏱️ 予定より巻いている</option>
            </select>
            <input type="number" id="my-val-input" value="10" min="0" placeholder="分">
        </div>
        
        <button class="save-btn" onclick="saveStatus('my')">MY体育館の状況を更新</button>
        <div id="my-success" class="success-msg">✓ データを一般サイトに送信しました！</div>
    </div>

    <script>
        // ページを開いたときに、今保存されている最新データをフォームに自動セット
        window.addEventListener('DOMContentLoaded', () => {
            initForm('p');
            initForm('my');
        });

        function initForm(prefix) {
            const saved = JSON.parse(localStorage.getItem('bunkasai_status_' + prefix));
            if (saved) {
                document.getElementById(prefix + '-current-input').value = saved.current;
                document.getElementById(prefix + '-next-input').value = saved.next;
                document.getElementById(prefix + '-type-input').value = saved.type;
                document.getElementById(prefix + '-val-input').value = saved.val;
            }
        }

        // ボタンを押したらブラウザの共有データ領域(LocalStorage)を書き換える
        function saveStatus(prefix) {
            const currentVal = document.getElementById(prefix + '-current-input').value;
            const nextVal = document.getElementById(prefix + '-next-input').value;
            const typeVal = document.getElementById(prefix + '-type-input').value;
            const numVal = parseInt(document.getElementById(prefix + '-val-input').value) || 0;

            const statusData = {
                current: currentVal,
                next: nextVal,
                type: typeVal,
                val: numVal
            };

            // 共通領域に保存（これでindex.html側が自動的に感知して読み込みます）
            localStorage.setItem('bunkasai_status_' + prefix, JSON.stringify(statusData));

            // 送信完了メッセージをチカッと出す演出
            const successDiv = document.getElementById(prefix + '-success');
            successDiv.style.display = 'block';
            setTimeout(() => { successDiv.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
